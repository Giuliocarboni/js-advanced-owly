<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owly</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./src/assets/img/favicon/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./src/css/styles.css" />
    <script type="module" src="./src/js/main.js" defer></script>
    <script defer src="./src/js-footer/footer-year-auto-update.js"></script>
  </head>
  <header>
    <nav><a href="#" id="logo">Owly</a></nav>
  </header>
  <body>
    <div class="app">
      <h1 class="form-title">
        Cerca generi letterari e lascia che Owly ti mostri i libri più popolari
        in ogni categoria
      </h1>
      <form class="form" id="search-form">
        <div class="search-box">
          <input
            type="search"
            class="form-input"
            id="search"
            placeholder="es. history, war, fantasy..."
            aria-label="Cerca un genere letterario"
            autocomplete="off" />
          <button class="search-btn" type="submit">Cerca</button>
        </div>
      </form>
      <div class="results-container" id="results" aria-live="polite"></div>
    </div>
  </body>
  <footer>
    <div class="footer-container">
      <div class="footer-social-links">
        <ul>
          <li>
            <a
              href="https://giuliocarboni.github.io/"
              rel="noopener"
              target="_blank"
              aria-label="Link Website">
              <i class="fa-solid fa-globe"></i>
            </a>
          </li>
          <li>
            <a
              href="https://github.com/Giuliocarboni"
              rel="noopener"
              target="_blank"
              aria-label="Link GitHub">
              <i class="fa-brands fa-github"></i>
            </a>
          </li>
          <li>
            <a
              href="https://www.linkedin.com/in/giulio-carboni-6a926a41b/?skipRedirect=true"
              rel="noopener"
              target="_blank">
              <i class="fa-brands fa-linkedin"></i>
            </a>
          </li>
        </ul>
      </div>
      <p class="copyright">
        &copy; <span id="current-year"></span> Giulio Carboni
      </p>
    </div>
  </footer>
</html>
