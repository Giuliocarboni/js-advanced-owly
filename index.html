<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="./src/css/styles.css" />
    <script type="module" src="./src/js/main.js" defer></script>
  </head>
  <body>
    <div class="app">
      <h1 class="form-title">Cerca un genere letterario!</h1>
      <form class="form" id="search-form">
        <label for="search" class="form-label"></label>

        <div class="search-box">
          <input
            type="search"
            class="form-input"
            id="search"
            placeholder="es. history, war, fantasy..."
            aria-label="Cerca un genere letterario" />
          <button class="search-btn" type="submit">Cerca</button>
        </div>
      </form>
      <div class="results-container" id="results" aria-live="polite"></div>
    </div>
  </body>
</html>
